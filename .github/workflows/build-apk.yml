name: Build KorexCode APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up old Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install legacy SDK platform & build-tools
        run: |
          sdkmanager "platforms;android-23" "build-tools;23.0.0" "platforms;android-16"

      - name: Set up JDK 8 for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :catroid:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KorexCode-debug-apk
          path: catroid/build/outputs/apk/*.apk
          if-no-files-found: warn
